<!DOCTYPE html>
<html lang="en">
<head>

    <title>Other Sites</title>
    <link rel="manifest" href="manifest.json">

<body>

        <div class="header">
            <h2><i class="fas fa-globe"></i> Other Websites</h2>

                <p>Watch videos</p>
            </a>

            </a>
