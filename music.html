<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#87CEEB">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2><i class="fas fa-music"></i> Music Player</h2>
        </div>
        
        <div class="music-player">
            <div class="album-art">
                <i class="fas fa-compact-disc"></i>
            </div>
            <h3 id="songTitle">No song selected</h3>
            
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>
            
            <div class="controls">
                <button id="prevBtn" title="Previous 10s"><i class="fas fa-backward"></i></button>
                <button id="playBtn" title="Play/Pause"><i class="fas fa-play"></i></button>
                <button id="nextBtn" title="Next 10s"><i class="fas fa-forward"></i></button>
                <button id="nextSongBtn" title="Next Song"><i class="fas fa-step-forward"></i></button>
            </div>
            
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volumeBar" min="0" max="100" value="70">
            </div>
        </div>
        
        <div class="playlist-section">
            <h3><i class="fas fa-list"></i> Playlist</h3>
            <div class="upload-section">
                <input type="file" id="audioUpload" accept="audio/*" multiple>
                <label for="audioUpload"><i class="fas fa-upload"></i> Upload Songs</label>
            </div>
            <div id="playlist" class="playlist"></div>
        </div>    </div>
    
    <nav class="bottom-nav">
        <a href="chat.html" class="nav-item"><i class="fas fa-comments"></i><span>Chat</span></a>
        <a href="music.html" class="nav-item active"><i class="fas fa-music"></i><span>Music</span></a>
        <a href="memories.html" class="nav-item"><i class="fas fa-images"></i><span>Memories</span></a>
        <a href="othersites.html" class="nav-item"><i class="fas fa-globe"></i><span>Sites</span></a>
        <a href="countdown.html" class="nav-item"><i class="fas fa-clock"></i><span>Countdown</span></a>
    </nav>
    
    <script src="app.js"></script>
    <script>
        const audioUpload = document.getElementById('audioUpload');
        const playlist = document.getElementById('playlist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const nextSongBtn = document.getElementById('nextSongBtn');
        const progressBar = document.getElementById('progressBar');
        const volumeBar = document.getElementById('volumeBar');
        const currentTime = document.getElementById('currentTime');
        const duration = document.getElementById('duration');
        const songTitle = document.getElementById('songTitle');
        
        let audio = new Audio();
        let songs = JSON.parse(localStorage.getItem('songs') || '[]');
        let currentSongIndex = -1;
        
        function renderPlaylist() {
            playlist.innerHTML = '';
            songs.forEach((song, index) => {
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                songDiv.innerHTML = `
                    <div class="song-info">
                        <i class="fas fa-music"></i>
                        <span>${song.name}</span>
                    </div>
                    <button class="delete-song" data-index="${index}"><i class="fas fa-trash"></i></button>
                `;
                songDiv.addEventListener('click', (e) => {
                    if (!e.target.closest('.delete-song')) {
                        playSong(index);
                    }
                });
                playlist.appendChild(songDiv);
            });
        }
        
        audioUpload.addEventListener('change', (e) => {            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    songs.push({
                        name: file.name,
                        data: event.target.result
                    });
                    localStorage.setItem('songs', JSON.stringify(songs));
                    renderPlaylist();
                };
                reader.readAsDataURL(file);
            });
        });
        
        playlist.addEventListener('click', (e) => {
            if (e.target.closest('.delete-song')) {
                const index = e.target.closest('.delete-song').dataset.index;
                songs.splice(index, 1);
                localStorage.setItem('songs', JSON.stringify(songs));
                renderPlaylist();
                if (currentSongIndex == index) {
                    audio.pause();
                    currentSongIndex = -1;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            }
        });
        
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentSongIndex = index;
            audio.src = songs[index].data;
            audio.play();
            songTitle.textContent = songs[index].name;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        }
        
        playBtn.addEventListener('click', () => {
            if (currentSongIndex === -1 && songs.length > 0) {
                playSong(0);
            } else if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        });
                prevBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        });
        
        nextBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        });
        
        nextSongBtn.addEventListener('click', () => {
            if (songs.length > 0) {
                currentSongIndex = (currentSongIndex + 1) % songs.length;
                playSong(currentSongIndex);
            }
        });
        
        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.value = progress || 0;
            currentTime.textContent = formatTime(audio.currentTime);
            duration.textContent = formatTime(audio.duration);
        });
        
        audio.addEventListener('ended', () => {
            nextSongBtn.click();
        });
        
        progressBar.addEventListener('input', () => {
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        });
        
        volumeBar.addEventListener('input', () => {
            audio.volume = volumeBar.value / 100;
        });
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        renderPlaylist();
        audio.volume = 0.7;
    </script>
</body>
</html>
